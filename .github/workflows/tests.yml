name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Keep CI compatible with the committed lockfile format.
          version: "0.11.32"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv --version && python --version
      - run: uv sync --extra dev --locked --python 3.11
      - run: uv run pytest
